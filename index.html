<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobbagent</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet">
<style>
  :root { --bg:#eaeff4; --card:#ffffff; --ink:#0b1520; --muted:#43515f; --line:#b4c0cc; --accent:#174e8c; --new:#d9e8f9; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0b121a; --card:#131d28; --ink:#f3f7fb; --muted:#b4c0cc; --line:#3a4d66; --accent:#8cc4fa; --new:#1c3a5c; }
  }
  * { box-sizing: border-box; }
  html { font-size:112.5%; }
  body { margin:0; background:var(--bg); color:var(--ink); font:1rem/1.55 "Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width:780px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font:700 1.6rem/1.2 "Inter", system-ui, -apple-system, "Segoe UI", sans-serif; letter-spacing:-.01em; margin:0 0 6px; }
  .meta { color:var(--muted); margin:0 0 20px; }
  input[type=search] { width:100%; padding:10px 12px; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; margin-bottom:10px; }
  input:focus-visible, a:focus-visible, button:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tools { display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; margin-bottom:16px; color:var(--muted); font-size:.95rem; }
  .tools label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .tools select, .tools button { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  .job { display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:10px; }
  .job.new { background:var(--new); border-color:var(--accent); }
  .job.done, .job.down { opacity:.72; }
  .job input[type=checkbox] { width:22px; height:22px; margin:2px 0 0; flex:none; cursor:pointer; accent-color:var(--accent); }
  .job > div { flex:1; min-width:0; }
  .job a { color:var(--accent); font-weight:600; text-decoration:none; }
  .job a:hover { text-decoration:underline; }
  .job p { margin:2px 0 0; color:var(--muted); font-size:.95rem; }
  .sok { display:flex; flex-direction:column; align-items:center; gap:2px; flex:none; font-size:.8rem; color:var(--muted); cursor:pointer; }
  .sok input { margin:0 !important; }
  .actions { display:flex; flex-wrap:wrap; gap:4px 16px; margin-top:6px; font-size:.95rem; }
  .job .actions a { font-weight:400; }
  .actions button { font:inherit; color:var(--accent); background:none; border:0; padding:0; cursor:pointer; text-decoration:underline; }
  .status { color:var(--muted); margin:-6px 0 12px; font-size:.95rem; }
  .status:empty { display:none; }
  .empty { color:var(--muted); }
  .badge { color:var(--accent); font-size:.9rem; margin-top:2px; }
  .thumbs { display:flex; gap:6px; }
  .job > .thumbs { flex:none; }
  .thumbs button { font-size:1.05rem; line-height:1; padding:6px 8px; background:transparent; border:1px solid var(--line); border-radius:6px; cursor:pointer; opacity:.7; }
  .thumbs button[aria-pressed=true] { opacity:1; border-color:var(--accent); background:var(--new); }
  .src { margin:2px 0 0; color:var(--muted); font-size:.95rem; }
  .src a { color:var(--accent); font-weight:400; }
  .links { margin:0 0 14px; color:var(--muted); font-size:.95rem; }
  .links a { color:var(--accent); }
</style>
</head>
<body>
<main>
  <h1>Jobb i Göteborg</h1>
  <p class="meta" id="meta">Hämtar jobb…</p>
  <p class="links" id="links"></p>
  <input id="filter" type="search" placeholder="Filtrera på titel, företag eller ort" aria-label="Filtrera jobb">
  <div class="tools">
    <label><input type="checkbox" id="hide"> Dölj jobb jag har sökt eller ogillat</label>
    <label>Sortera: <select id="sort"><option value="new">Nyast först</option><option value="match">Bäst match först</option><option value="deadline">Sista ansökningsdag</option></select></label>
    <button id="export" type="button">Kopiera mina betyg</button>
    <span id="count"></span>
  </div>
  <p class="status" id="status" role="status"></p>
  <div id="list"></div>
</main>
<script>
const KEY = "jobbagent-sokta";
const RKEY = "jobbagent-betyg";
let applied = new Set();
let ratings = {};
try { applied = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
try { ratings = JSON.parse(localStorage.getItem(RKEY) || "{}"); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify([...applied])); } catch (e) {} }
function saveRatings() { try { localStorage.setItem(RKEY, JSON.stringify(ratings)); } catch (e) {} }

let data = { jobs: [] };
const list = document.getElementById("list");
const meta = document.getElementById("meta");

function isNew(job) {
  const age = (Date.now() - new Date(job.published).getTime()) / 86400000;
  return age <= 2;
}

// Enkel inlärning: ord i rubrik och företag får poäng av dina tummar.
const STOP = new Set(["och", "med", "för", "till", "som", "att", "inom", "hos", "the", "and", "for", "with"]);
function tokens(title, employer) {
  const text = ((title || "") + " " + (employer || "")).toLowerCase();
  return [...new Set(text.split(/[^a-zåäö0-9]+/).filter(w => w.length >= 3 && !STOP.has(w)))];
}
function weights() {
  const w = {};
  for (const r of Object.values(ratings)) for (const t of tokens(r.t, r.e)) w[t] = (w[t] || 0) + r.v;
  return w;
}

// Ansökningsflödet: öppnar en ny chatt i projektet Jobbsökning med färdig prompt.
const CLAUDE_PROJECT = "01a142e1-be39-7253-a6c2-2ac03bb49ee3";
function applicationPrompt(j) {
  const rows = ["Titel: " + j.title, "Företag: " + j.employer, "Ort: " + j.place];
  if (j.deadline) rows.push("Sista ansökningsdag: " + j.deadline);
  rows.push("Annons: " + j.url);
  return "Skapa ansökningshandlingar (CV och personligt brev) för det här jobbet.\n\n" + rows.join("\n") +
    "\n\nLäs annonsen via länken och följ projektets instruktioner. Om annonsen inte går att läsa, be mig klistra in texten.";
}
function claudeUrl(j) {
  return "https://claude.ai/new?project=" + CLAUDE_PROJECT + "&q=" + encodeURIComponent(applicationPrompt(j));
}
function copyPrompt(j, msg) {
  const status = document.getElementById("status");
  navigator.clipboard.writeText(applicationPrompt(j))
    .then(() => { status.textContent = msg || "Prompten är kopierad. Klistra in den i projektet Jobbsökning."; })
    .catch(() => window.prompt("Kopiera prompten:", applicationPrompt(j)));
}
function startApplication(j) {
  const w = window.open(claudeUrl(j), "_blank");
  if (w) w.opener = null;
  else copyPrompt(j, "Webbläsaren blockerade den nya fliken. Prompten är kopierad: öppna projektet Jobbsökning i Claude och klistra in den.");
}

function idsOf(j) { return [j.id].concat(j.altIds || []); }
function isApplied(j) { return idsOf(j).some(id => applied.has(id)); }
function myRating(j) { for (const id of idsOf(j)) if (ratings[id]) return ratings[id].v; return 0; }

function rate(job, v) {
  const cur = myRating(job);
  for (const id of idsOf(job)) delete ratings[id];
  if (cur !== v) ratings[job.id] = { v, t: job.title, e: job.employer, p: job.place };
  saveRatings();
  render();
}

function exportText() {
  const rows = Object.values(ratings);
  const fmt = r => "- " + [r.t, r.e, r.p].filter(Boolean).join(" | ");
  const part = v => rows.filter(r => r.v === v).map(fmt).join("\n") || "-";
  return "Gillade jobb:\n" + part(1) + "\n\nOgillade jobb:\n" + part(-1);
}

function render() {
  const q = document.getElementById("filter").value.trim().toLowerCase();
  const hide = document.getElementById("hide").checked;
  const sortBy = document.getElementById("sort").value;
  const w = weights();
  const ready = Object.keys(ratings).length >= 4;

  const jobs = data.jobs.filter(j =>
    (j.title + " " + j.employer + " " + j.place + " " + j.sources.map(x => x.name).join(" ")).toLowerCase().includes(q) &&
    !(hide && (isApplied(j) || myRating(j) === -1))
  );
  for (const j of jobs) {
    j._s = ready ? tokens(j.title, j.employer).reduce((s, t) => s + (w[t] || 0), 0) : 0;
    j._r = myRating(j) === -1 ? -1000 : j._s;
  }
  if (sortBy === "match") jobs.sort((a, b) => (b._r - a._r) || b.published.localeCompare(a.published));
  else if (sortBy === "deadline") jobs.sort((a, b) =>
    (a.deadline || "9999").localeCompare(b.deadline || "9999") || b.published.localeCompare(a.published));

  document.getElementById("count").textContent =
    applied.size + " sökta, " + Object.keys(ratings).length + " betygsatta";
  list.replaceChildren();
  if (!jobs.length) {
    list.innerHTML = '<p class="empty">Inga jobb matchar filtret.</p>';
    return;
  }
  for (const j of jobs) {
    const my = myRating(j);
    const div = document.createElement("div");
    div.className = "job" + (isNew(j) ? " new" : "") + (isApplied(j) ? " done" : "") + (my === -1 ? " down" : "");

    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = isApplied(j);
    box.setAttribute("aria-label", "Sök jobbet och starta ansökan: " + j.title);
    box.addEventListener("change", () => {
      if (box.checked) { applied.add(j.id); startApplication(j); } else idsOf(j).forEach(id => applied.delete(id));
      save();
      render();
    });
    const sok = document.createElement("label");
    sok.className = "sok";
    const sokText = document.createElement("span");
    sokText.textContent = "Sök";
    sok.append(box, sokText);

    const body = document.createElement("div");
    body.className = "body";
    const a = document.createElement("a");
    a.href = j.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = j.title;
    const p = document.createElement("p");
    const parts = [j.employer, j.place, "Publicerad " + j.published];
    if (j.deadline) parts.push("Sista ansökningsdag " + j.deadline);
    p.textContent = parts.filter(Boolean).join(", ");
    const src = document.createElement("p");
    src.className = "src";
    src.append("Annonsen finns hos: ");
    j.sources.forEach((x, i) => {
      if (i) src.append(" · ");
      if (x.url) {
        const l = document.createElement("a");
        l.href = x.url; l.target = "_blank"; l.rel = "noopener"; l.textContent = x.name;
        src.append(l);
      } else src.append(x.name);
    });
    body.append(a, p, src);
    if (ready && !my && j._s >= 2) {
      const b = document.createElement("div");
      b.className = "badge"; b.textContent = "Liknar jobb du har gillat";
      body.append(b);
    } else if (ready && !my && j._s <= -2) {
      const b = document.createElement("div");
      b.className = "badge"; b.textContent = "Liknar jobb du har ogillat";
      body.append(b);
    }

    if (isApplied(j)) {
      const act = document.createElement("div");
      act.className = "actions";
      const open = document.createElement("a");
      open.href = claudeUrl(j); open.target = "_blank"; open.rel = "noopener";
      open.textContent = "Öppna ansökan i Claude";
      const copy = document.createElement("button");
      copy.type = "button"; copy.textContent = "Kopiera prompt";
      copy.addEventListener("click", () => copyPrompt(j));
      act.append(open, copy);
      body.append(act);
    }

    const thumbs = document.createElement("div");
    thumbs.className = "thumbs";
    for (const [v, icon, label] of [[1, "👍", "Tummen upp"], [-1, "👎", "Tummen ner"]]) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = icon;
      btn.setAttribute("aria-label", label + ": " + j.title);
      btn.setAttribute("aria-pressed", my === v ? "true" : "false");
      btn.addEventListener("click", () => rate(j, v));
      thumbs.append(btn);
    }

    div.append(sok, body, thumbs);
    list.append(div);
  }
}

// LINKS-START
const terms = ["säljingenjör", "teknisk säljare", "sales engineer", "innesäljare"];
const liQuery = terms.map(t => t.includes(" ") ? '"' + t + '"' : t).join(" OR ");
const inQuery = terms.map(t => t.includes(" ") ? '"' + t + '"' : t).join(" or ");
document.getElementById("links").innerHTML = "Sök själv: " +
  '<a href="https://www.linkedin.com/jobs/search/?keywords=' + encodeURIComponent(liQuery) + '&location=' + encodeURIComponent("Göteborg") + '&sortBy=DD" target="_blank" rel="noopener">LinkedIn</a> · ' +
  '<a href="https://se.indeed.com/jobs?q=' + encodeURIComponent(inQuery) + '&l=' + encodeURIComponent("Göteborg") + '&sort=date" target="_blank" rel="noopener">Indeed</a>';
// LINKS-END

// Jobb från e-postaviseringar (Gmail): linkedin.json och jooble-epost.json.
const LI_ALERTS = ["Säljingenjör"];   // LinkedIn-aviseringar som visas
function loadFeed(file, name, pick) {
  return fetch(file).then(r => r.json()).then(d => ({
    updated: d.updated,
    jobs: d.jobs.filter(pick).map(j => ({
      id: (name === "LinkedIn" ? "li-" : "jooble-") + j.id, title: j.title, employer: j.company, place: j.location,
      published: j.received, url: j.url, source: name
    }))
  })).catch(() => ({ updated: null, jobs: [] }));
}

// Samma annons på flera ställen slås ihop. Matchning: samma arbetsgivare och lika rubrik.
const LEGAL = new Set(["ab", "aktiebolag", "gmbh", "plc", "corporation", "corp", "inc", "ltd", "group", "sverige", "sweden", "the"]);
function normWords(s) {
  return (s || "").normalize("NFKC").toLowerCase().split(/[^a-zåäö0-9]+/).filter(w => w);
}
function employerKey(s) { return normWords(s).filter(w => !LEGAL.has(w)).join(" "); }
function similarTitle(a, b) {
  const x = new Set(normWords(a)), y = new Set(normWords(b));
  if (!x.size || !y.size) return false;
  let both = 0;
  for (const w of x) if (y.has(w)) both++;
  return both / (x.size + y.size - both) >= 0.7;
}
function addSource(job, name, url) {
  if (!job.sources.some(s => s.name === name)) job.sources.push({ name, url });
}
function mergeJobs(list) {
  const out = [];
  for (const j of list) {
    j.sources = (j.sources && j.sources.length) ? j.sources.slice() : [{ name: j.source, url: j.url }];
    const ek = employerKey(j.employer);
    // Två annonser från samma källa slås aldrig ihop (kan vara olika tjänster hos samma företag).
    const overlap = o => j.sources.some(s => o.sources.some(t => t.name === s.name));
    const hit = out.find(o => o.id === j.id || (!overlap(o) && ek && employerKey(o.employer) === ek && similarTitle(o.title, j.title)));
    if (!hit) { j.altIds = []; out.push(j); continue; }
    if (hit.id !== j.id) hit.altIds.push(j.id);
    for (const s of j.sources) addSource(hit, s.name, s.url);
    if (j.published && (!hit.published || j.published < hit.published)) hit.published = j.published;
    if (!hit.deadline && j.deadline) hit.deadline = j.deadline;
  }
  return out;
}

Promise.all([
  fetch("jobs.json").then(r => r.json()),
  loadFeed("linkedin.json", "LinkedIn", j => LI_ALERTS.includes(j.alert)),
  loadFeed("jooble-epost.json", "Jooble", () => true)
]).then(([d, li, jo]) => {
    data = { ...d, jobs: mergeJobs(d.jobs.concat(li.jobs, jo.jobs)) };
    const counts = {};
    for (const j of data.jobs) for (const s of j.sources) counts[s.name] = (counts[s.name] || 0) + 1;
    const when = new Date(d.updated).toLocaleString("sv-SE", { dateStyle: "long", timeStyle: "short" });
    meta.textContent = data.jobs.length + " jobb. Källor: " +
      Object.entries(counts).map(([k, v]) => k + " " + v).join(", ") +
      " (en annons kan finnas hos flera). Uppdaterad " + when +
      (li.updated ? "; LinkedIn-mejl " + li.updated : "") + (jo.updated ? "; Jooble-mejl " + jo.updated : "") +
      ". Nya jobb (senaste två dagarna) har blå bakgrund.";
    render();
  })
  .catch(() => { meta.textContent = "Kunde inte läsa jobs.json. Kör uppdateringen under Actions först."; });

document.getElementById("filter").addEventListener("input", render);
document.getElementById("hide").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
document.getElementById("export").addEventListener("click", () => {
  const text = exportText();
  const btn = document.getElementById("export");
  navigator.clipboard.writeText(text)
    .then(() => { btn.textContent = "Kopierat!"; setTimeout(() => btn.textContent = "Kopiera mina betyg", 2000); })
    .catch(() => window.prompt("Kopiera texten:", text));
});
</script>
</body>
</html>
