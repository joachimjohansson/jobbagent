<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jobbagent</title>
<link rel="icon" href="favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
  :root { --bg:#f6f8fa; --card:#ffffff; --ink:#14202e; --muted:#5d6b7a; --line:#dde3ea; --accent:#1f5fa8; --new:#e8f1fb; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#0f1720; --card:#16212d; --ink:#e7edf3; --muted:#93a1b0; --line:#26354a; --accent:#6fb0f0; --new:#183049; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--ink); font:16px/1.5 system-ui,-apple-system,"Segoe UI",sans-serif; }
  main { max-width:760px; margin:0 auto; padding:24px 16px 48px; }
  h1 { font-size:1.6rem; margin:0 0 4px; }
  .meta { color:var(--muted); margin:0 0 20px; }
  input[type=search] { width:100%; padding:10px 12px; font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; margin-bottom:10px; }
  input:focus-visible, a:focus-visible, button:focus-visible, select:focus-visible { outline:2px solid var(--accent); outline-offset:2px; }
  .tools { display:flex; flex-wrap:wrap; align-items:center; gap:8px 20px; margin-bottom:16px; color:var(--muted); font-size:.92rem; }
  .tools label { display:flex; align-items:center; gap:6px; cursor:pointer; }
  .tools select, .tools button { font:inherit; color:var(--ink); background:var(--card); border:1px solid var(--line); border-radius:6px; padding:4px 10px; cursor:pointer; }
  .job { display:flex; gap:12px; align-items:flex-start; background:var(--card); border:1px solid var(--line); border-radius:6px; padding:12px 14px; margin-bottom:10px; }
  .job.new { background:var(--new); border-color:var(--accent); }
  .job.done, .job.down { opacity:.6; }
  .job input[type=checkbox] { width:22px; height:22px; margin:2px 0 0; flex:none; cursor:pointer; accent-color:var(--accent); }
  .job .body { flex:1; min-width:0; }
  .job a { color:var(--accent); font-weight:600; text-decoration:none; }
  .job a:hover { text-decoration:underline; }
  .job p { margin:2px 0 0; color:var(--muted); font-size:.92rem; }
  .badge { color:var(--accent); font-size:.85rem; margin-top:2px; }
  .thumbs { display:flex; gap:6px; flex:none; }
  .thumbs button { font-size:1.05rem; line-height:1; padding:6px 8px; background:transparent; border:1px solid var(--line); border-radius:6px; cursor:pointer; opacity:.55; }
  .thumbs button[aria-pressed=true] { opacity:1; border-color:var(--accent); background:var(--new); }
  .links { margin:0 0 14px; color:var(--muted); font-size:.92rem; }
  .links a { color:var(--accent); }
  .empty { color:var(--muted); }
</style>
</head>
<body>
<main>
  <h1>Jobb i Göteborg</h1>
  <p class="meta" id="meta">Hämtar jobb…</p>
  <p class="links" id="links"></p>
  <input id="filter" type="search" placeholder="Filtrera på titel, företag eller ort" aria-label="Filtrera jobb">
  <div class="tools">
    <label><input type="checkbox" id="hide"> Dölj jobb jag har sökt eller ogillat</label>
    <label>Sortera: <select id="sort"><option value="new">Nyast först</option><option value="match">Bäst match först</option><option value="deadline">Sista ansökningsdag</option></select></label>
    <button id="export" type="button">Kopiera mina betyg</button>
    <span id="count"></span>
  </div>
  <div id="list"></div>
</main>
<script>
const KEY = "jobbagent-sokta";
const RKEY = "jobbagent-betyg";
let applied = new Set();
let ratings = {};
try { applied = new Set(JSON.parse(localStorage.getItem(KEY) || "[]")); } catch (e) {}
try { ratings = JSON.parse(localStorage.getItem(RKEY) || "{}"); } catch (e) {}
function save() { try { localStorage.setItem(KEY, JSON.stringify([...applied])); } catch (e) {} }
function saveRatings() { try { localStorage.setItem(RKEY, JSON.stringify(ratings)); } catch (e) {} }

let data = { jobs: [] };
const list = document.getElementById("list");
const meta = document.getElementById("meta");

function isNew(job) {
  const age = (Date.now() - new Date(job.published).getTime()) / 86400000;
  return age <= 2;
}

// Enkel inlärning: ord i rubrik och företag får poäng av dina tummar.
const STOP = new Set(["och", "med", "för", "till", "som", "att", "inom", "hos", "the", "and", "for", "with"]);
function tokens(title, employer) {
  const text = ((title || "") + " " + (employer || "")).toLowerCase();
  return [...new Set(text.split(/[^a-zåäö0-9]+/).filter(w => w.length >= 3 && !STOP.has(w)))];
}
function weights() {
  const w = {};
  for (const r of Object.values(ratings)) for (const t of tokens(r.t, r.e)) w[t] = (w[t] || 0) + r.v;
  return w;
}

function rate(job, v) {
  if (ratings[job.id] && ratings[job.id].v === v) delete ratings[job.id];
  else ratings[job.id] = { v, t: job.title, e: job.employer, p: job.place };
  saveRatings();
  render();
}

function exportText() {
  const rows = Object.values(ratings);
  const fmt = r => "- " + [r.t, r.e, r.p].filter(Boolean).join(" | ");
  const part = v => rows.filter(r => r.v === v).map(fmt).join("\n") || "-";
  return "Gillade jobb:\n" + part(1) + "\n\nOgillade jobb:\n" + part(-1);
}

function render() {
  const q = document.getElementById("filter").value.trim().toLowerCase();
  const hide = document.getElementById("hide").checked;
  const sortBy = document.getElementById("sort").value;
  const w = weights();
  const ready = Object.keys(ratings).length >= 4;

  const jobs = data.jobs.filter(j =>
    (j.title + " " + j.employer + " " + j.place).toLowerCase().includes(q) &&
    !(hide && (applied.has(j.id) || (ratings[j.id] && ratings[j.id].v === -1)))
  );
  for (const j of jobs) {
    j._s = ready ? tokens(j.title, j.employer).reduce((s, t) => s + (w[t] || 0), 0) : 0;
    j._r = ratings[j.id] && ratings[j.id].v === -1 ? -1000 : j._s;
  }
  if (sortBy === "match") jobs.sort((a, b) => (b._r - a._r) || b.published.localeCompare(a.published));
  else if (sortBy === "deadline") jobs.sort((a, b) =>
    (a.deadline || "9999").localeCompare(b.deadline || "9999") || b.published.localeCompare(a.published));

  document.getElementById("count").textContent =
    applied.size + " sökta, " + Object.keys(ratings).length + " betygsatta";
  list.replaceChildren();
  if (!jobs.length) {
    list.innerHTML = '<p class="empty">Inga jobb matchar filtret.</p>';
    return;
  }
  for (const j of jobs) {
    const my = ratings[j.id] ? ratings[j.id].v : 0;
    const div = document.createElement("div");
    div.className = "job" + (isNew(j) ? " new" : "") + (applied.has(j.id) ? " done" : "") + (my === -1 ? " down" : "");

    const box = document.createElement("input");
    box.type = "checkbox";
    box.checked = applied.has(j.id);
    box.setAttribute("aria-label", "Markera som sökt: " + j.title);
    box.addEventListener("change", () => {
      if (box.checked) applied.add(j.id); else applied.delete(j.id);
      save();
      render();
    });

    const body = document.createElement("div");
    body.className = "body";
    const a = document.createElement("a");
    a.href = j.url; a.target = "_blank"; a.rel = "noopener"; a.textContent = j.title;
    const p = document.createElement("p");
    const parts = [j.employer, j.place, "Publicerad " + j.published];
    if (j.deadline) parts.push("Sista ansökningsdag " + j.deadline);
    if (j.source) parts.push("Källa: " + j.source);
    p.textContent = parts.filter(Boolean).join(", ");
    body.append(a, p);
    if (ready && !my && j._s >= 2) {
      const b = document.createElement("div");
      b.className = "badge"; b.textContent = "Liknar jobb du har gillat";
      body.append(b);
    } else if (ready && !my && j._s <= -2) {
      const b = document.createElement("div");
      b.className = "badge"; b.textContent = "Liknar jobb du har ogillat";
      body.append(b);
    }

    const thumbs = document.createElement("div");
    thumbs.className = "thumbs";
    for (const [v, icon, label] of [[1, "👍", "Tummen upp"], [-1, "👎", "Tummen ner"]]) {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.textContent = icon;
      btn.setAttribute("aria-label", label + ": " + j.title);
      btn.setAttribute("aria-pressed", my === v ? "true" : "false");
      btn.addEventListener("click", () => rate(j, v));
      thumbs.append(btn);
    }

    div.append(box, body, thumbs);
    list.append(div);
  }
}

// LINKS-START
const terms = ["säljingenjör", "teknisk säljare", "sales engineer", "innesäljare"];
const liQuery = terms.map(t => t.includes(" ") ? '"' + t + '"' : t).join(" OR ");
const inQuery = terms.map(t => t.includes(" ") ? '"' + t + '"' : t).join(" or ");
document.getElementById("links").innerHTML = "Sök själv: " +
  '<a href="https://www.linkedin.com/jobs/search/?keywords=' + encodeURIComponent(liQuery) + '&location=' + encodeURIComponent("Göteborg") + '&sortBy=DD" target="_blank" rel="noopener">LinkedIn</a> · ' +
  '<a href="https://se.indeed.com/jobs?q=' + encodeURIComponent(inQuery) + '&l=' + encodeURIComponent("Göteborg") + '&sort=date" target="_blank" rel="noopener">Indeed</a>';
// LINKS-END

fetch("jobs.json")
  .then(r => r.json())
  .then(d => {
    data = d;
    const when = new Date(d.updated).toLocaleString("sv-SE", { dateStyle: "long", timeStyle: "short" });
    meta.textContent = d.jobs.length + " jobb. Uppdaterad " + when + ". Nya jobb (senaste två dagarna) har blå bakgrund.";
    render();
  })
  .catch(() => { meta.textContent = "Kunde inte läsa jobs.json. Kör uppdateringen under Actions först."; });

document.getElementById("filter").addEventListener("input", render);
document.getElementById("hide").addEventListener("change", render);
document.getElementById("sort").addEventListener("change", render);
document.getElementById("export").addEventListener("click", () => {
  const text = exportText();
  const btn = document.getElementById("export");
  navigator.clipboard.writeText(text)
    .then(() => { btn.textContent = "Kopierat!"; setTimeout(() => btn.textContent = "Kopiera mina betyg", 2000); })
    .catch(() => window.prompt("Kopiera texten:", text));
});
</script>
</body>
</html>
